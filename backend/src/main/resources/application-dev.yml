# =====================================================================
# 开发环境配置：仅为「本机跑起来」服务，所有取值都应在生产中被覆盖
# =====================================================================
# 启动前需要提供的环境变量：
#   DEEPSEEK_API_KEY  大模型密钥（对话功能必需）
# 说明：原先写死在配置里的密钥已移除。任何曾经随代码提交过的密钥
#      都应视为已泄露并完成轮换。
# =====================================================================

spring:
  datasource:
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:}

jwt:
  # 仅本地开发使用的默认值，长度已满足 32 字节校验；生产必须由环境变量覆盖
  secret: ${JWT_SECRET:local-dev-only-jwt-secret-key-please-rotate-0123456789}

mybatis-plus:
  configuration:
    # 开发期打印 SQL 便于排查，生产环境使用默认的不打印
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  cors:
    # 前端直连后端（未经 Vite 代理）时使用；经代理访问属同源，无需跨域
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  payment:
    # 本地启用模拟支付，链路与真实回调一致（同样需要验签）
    gateway: mock
    callback-secret: ${PAYMENT_CALLBACK_SECRET:local-dev-only-payment-sign-secret}

logging:
  level:
    com.hotel: debug
